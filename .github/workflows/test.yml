name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      # devDependencies use React 19, so swap in React 18 for that matrix entry.
      - name: Install React 18
        if: matrix.react == '18'
        run: >-
          npm install --no-save
          react@^18.2.0 react-dom@^18.2.0
          @types/react@^18.2.0 @types/react-dom@^18.2.0

      - name: Type check
        run: npm run test:lint

      - name: Unit test
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run rollup

      - name: Build Storybook
        run: npm run build-storybook
