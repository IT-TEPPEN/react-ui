name: publish

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  # Trusted Publishing (OIDC) for npm
  id-token: write
  # push the version tag and create the GitHub Release
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release'))
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Trusted Publishing needs npm >= 11.5.1 (updated below)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          scope: "@teppen"

      - name: Install dependencies
        run: npm ci

      - name: Build Pacakge
        run: npm run rollup

      - name: Set New Version And Release Tag
        run: |
          NEW_VERSION=$(node -pe "require('./package.json').version")
          echo "NEW_VERSION=v${NEW_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${NEW_VERSION}" >> $GITHUB_ENV

      # Updated only for publishing, so dependency install keeps the bundled npm.
      - name: Update npm
        run: npm install -g npm@11

      # No token: npm authenticates this workflow via Trusted Publishing.
      - name: Publish Package
        run: npm publish --access=public

      - name: push new version tag
        run: |
          git tag ${{ env.RELEASE_TAG }}
          git push origin ${{ env.RELEASE_TAG }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
